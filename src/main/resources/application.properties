spring.application.name=proytic2026

# --- Base de datos por defecto: H2 en memoria (para desarrollo rápido, se borra al reiniciar) ---
# Para usar PostgreSQL, arrancar con el perfil "postgres" (ver application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:proytic;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Administrador inicial (ver AdminBootstrap) ---
# Los administradores no se registran desde la web: la app crea el primero al arrancar.
# Estos valores son SOLO para desarrollo con H2. En Supabase la contraseña sale de ADMIN_PASSWORD.
app.admin.email=${ADMIN_EMAIL:admin@mnatural.uy}
app.admin.password=${ADMIN_PASSWORD:admin1234}
app.admin.name=Administrador

spring.application.name=proytic2026

# --- Base de datos por defecto: H2 en memoria (para desarrollo rápido, se borra al reiniciar) ---
# Para usar PostgreSQL, arrancar con el perfil "postgres" (ver application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:proytic;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Administrador inicial (lo crea AdminInitializer si no hay ninguno) ---
# En H2 local se usa esta contraseña por defecto para poder probar el CU-03.
# Es solo para tu compu: el perfil "postgres" la anula y exige ADMIN_PASSWORD.
app.admin.email=${ADMIN_EMAIL:admin@uruguaymnatural.uy}
app.admin.password=${ADMIN_PASSWORD:admin1234}
app.admin.name=${ADMIN_NAME:Administrador}

# --- Pagos (CU-15) con Mercado Pago ---
# Sin estas variables los pagos son simulados (no se conecta a nada). Para usar el sandbox de
# Mercado Pago, definir MP_PUBLIC_KEY y MP_ACCESS_TOKEN con las credenciales de prueba (ver README).
# NUNCA escribirlas en este archivo: el access token permite cobrar y el repo es público.
app.payments.mercadopago.public-key=${MP_PUBLIC_KEY:}
app.payments.mercadopago.access-token=${MP_ACCESS_TOKEN:}
# Opcional: correo del pagador para las pruebas (por defecto, el del turista).
app.payments.mercadopago.payer-email=${MP_PAYER_EMAIL:}

# --- Actualizar el estado de las reservas (CU-16) ---
# Cada cuánto se revisan las reservas: vencen las pendientes sin pagar y finalizan las de fechas
# que ya terminaron. En milisegundos (300000 = 5 minutos).
app.reservations.status-job.enabled=true
app.reservations.status-job.every-ms=300000
app.reservations.status-job.initial-delay-ms=30000

# Foto de portada de las actividades: el navegador la achica antes de subirla y el servidor guarda
# hasta 3 MB (ActivityPhotoService). Este l�mite es solo el m�ximo que se acepta recibir.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=12MB

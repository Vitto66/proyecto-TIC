# Mensajes de validación que no salen de las anotaciones de los DTO.
# typeMismatch: el valor que llegó del formulario no se pudo convertir (por ejemplo, texto en un
# campo numérico). Sin esto, Spring muestra el mensaje técnico de la excepción.
typeMismatch=no es un valor válido
typeMismatch.java.lang.Integer=tiene que ser un número entero
typeMismatch.java.math.BigDecimal=tiene que ser un número
typeMismatch.java.time.LocalDate=no es una fecha válida
typeMismatch.java.time.LocalTime=no es una hora válida

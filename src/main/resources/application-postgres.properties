# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Credenciales por variables de entorno para no subirlas a Git.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:proytic}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.h2.console.enabled=false

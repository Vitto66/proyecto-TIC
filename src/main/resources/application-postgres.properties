# Base compartida del equipo en Supabase (PostgreSQL), vía Session pooler.
# Uso: activar el perfil "postgres" y definir la variable de entorno DB_PASSWORD
# (ver README). NUNCA escribir la contraseña en este archivo: el repo es público.
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-us-east-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres.zbfdaacmcfrzcuntdhuq}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# Las tablas las administra el equipo con scripts SQL en Supabase.
# Hibernate solo verifica que las entidades coincidan; no crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=validate

# El plan gratuito tiene pocas conexiones: un pool chico por cada integrante.
spring.datasource.hikari.maximum-pool-size=3

# Administrador inicial: en Supabase NUNCA se usa la contraseña por defecto de H2.
# Solo hace falta definir ADMIN_PASSWORD la primera vez, cuando no hay ningún admin.
app.admin.password=${ADMIN_PASSWORD:}

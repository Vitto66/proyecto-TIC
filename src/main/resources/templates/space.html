<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Uruguay Mnatural'">Tu espacio · Uruguay Mnatural</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" href="../static/css/main.css" rel="stylesheet">
    <link th:href="@{/css/home.css}" href="../static/css/home.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <div class="container-xl d-flex align-items-center justify-content-between">
        <a class="brand text-decoration-none" th:href="@{/}" href="home.html">Uruguay <span>Mnatural</span></a>
        <span class="space-user" th:text="${currentUser.displayName}">Nombre</span>
    </div>
</header>

<main class="container-xl register">
    <section class="sent-card" role="status">
        <div class="sent-sun" aria-hidden="true"></div>
        <h1 th:text="${title}">Tu espacio</h1>
        <p th:text="'Hola, ' + ${currentUser.displayName} + '.'" class="mb-2">Hola.</p>

        <!-- Un prestador PENDING puede entrar, pero todavía no puede publicar -->
        <div class="alert alert-warning mt-3" role="alert" th:if="${pendingProvider}">
            Tu cuenta está pendiente de aprobación por un administrador. Mientras tanto no podés
            publicar actividades.
        </div>

        <p th:text="${intro}">Descripción del espacio.</p>

        <div class="space-actions">
            <a class="btn-outline-monte" th:href="@{/}" href="home.html">Ir al menú</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-submit">Cerrar sesión</button>
            </form>
        </div>
    </section>
</main>

</body>
</html>

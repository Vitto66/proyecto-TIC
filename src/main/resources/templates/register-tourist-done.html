<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}" href="../static/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuenta creada · Uruguay Mnatural</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" href="../static/css/main.css" rel="stylesheet">
    <link th:href="@{/css/home.css}" href="../static/css/home.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <div class="container-xl">
        <a class="brand text-decoration-none" th:href="@{/}" href="home.html"><img class="brand-mark" th:src="@{/img/oasis-mark.png}" src="../static/img/oasis-mark.png" alt="" width="34" height="34">Uruguay <span>Mnatural</span></a>
    </div>
</header>

<main class="container-xl register">
    <section class="sent-card" role="status">
        <div class="sent-sun" aria-hidden="true"></div>
        <h1>¡Tu cuenta está lista!</h1>
        <p>
            Ya podés reservar actividades en todo el país. Cuando elijas una, iniciá sesión con tu
            correo y tu contraseña.
        </p>
        <div class="space-actions">
            <a class="btn btn-submit" th:href="@{/login}" href="login.html">Iniciar sesión</a>
            <a class="btn-outline-monte" th:href="@{/}" href="home.html">Ir al menú</a>
        </div>
    </section>
</main>

</body>
</html>
